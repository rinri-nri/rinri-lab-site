# ここにたどり着くまでの疑問の道すじ。上から順に、線でつないだ札になる。
# 最初の 疑問 が、この動画のきっかけ（トップのカードにも出る）
[["流れ"]]
"疑問" = "AIに質問しながら勉強すると、バカになるの？"
"分かったこと" = "トルコの高校の実験では、答えを渡すAIで練習した生徒は、AIを外した試験で17%点が下がった。答えを渡さないAIでは下がらなかった。"

[["流れ"]]
"疑問" = "AIは、力のある人ほど伸ばす増幅装置なの？"
"分かったこと" = "仕事の現場では、AIは経験の浅い人を助けて差を縮めた。けれど大学院の授業では、知識の多い学生と少ない学生の差を広げた。"

[["流れ"]]
"疑問" = "それなら、苦手な子にはAIを使わせないほうがいいの？"
"分かったこと" = "使わせないより、答えを渡さないように作り込んだAIのほうが、今の証拠に合う。ハーバードの物理の授業では、教室の授業の2倍以上学べた。"

[["流れ"]]
"疑問" = "でも、家のスマホでは何でも答えるAIが使えてしまうのでは？"
"分かったこと" = "そのとおりで、きれいに解決した研究はまだない。家での使い方は、多くの場合、親で決まる。"

[["流れ"]]
"疑問" = "結局、生まれた家で決まってしまうの？"
"分かったこと" = "家庭の影響は大きい。それでも、育つ家が変わるとIQは4〜8点変わった。使い方を本人任せにすることが差を広げる、と分かった。ここまでを1本にまとめた。"

