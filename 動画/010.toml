# ここにたどり着くまでの疑問の道すじ。上から順に、線でつないだ札になる。
# 最初の 疑問 が、この動画のきっかけ（トップのカードにも出る）
[["流れ"]]
"疑問" = "子どもの読解力は、上がっているの？下がっているの？"
"分かったこと" = "日本は上下をくり返しながら、長い目で見るとほぼ横ばいだった。下がっていたのは、世界全体（特に米国）のほうだった。"

[["流れ"]]
"疑問" = "じゃあ、なぜ日本の順位は上がったり下がったりするの？"
"分かったこと" = "2018年の下落は、試験が紙から画面に変わり、ウェブや投稿の文章を読む問題が増えたため。2022年の上昇は、端末に慣れたことと、ほかの国がコロナの休校で大きく下がったことが大きかった。"

[["流れ"]]
"疑問" = "アメリカの子どもの読解力は、なぜ下がっているの？"
"分かったこと" = "決着していない。コロナの休校、欠席の増加、スマホとSNS、読み方の教え方などの説が並ぶ。成績下位の子ほど落ちていて、30年余りで最低になった。"

[["流れ"]]
"疑問" = "2019年の「読解力、急落」は、本当だったの？"
"分かったこと" = "2018年の504点は、2003・2006年の498点より高い。抽出調査なので点には誤差の幅もある。22年を通すと、日本の点数の傾きは統計的に有意でない「平坦型」だった。"

[["流れ"]]
"疑問" = "日本は、なぜ崩れなかったの？"
"分かったこと" = "休校が短く（3か月以上は15.5%、OECD平均は50.3%）、SNSを長く見る子も少なかった。ただ、情報の信ぴょう性を評価する問題に答えられたのは、まだ7人に1人。ここまでを1本にまとめた。"

