# 段落は空行で区切る
"流れ" = """
最初の疑問は「国語力はどうやったら伸びるのか」でした。調べると、読む力は語彙・背景知識・文の構造を追う力に分けられ、なかでも背景知識がよく効く、という研究に行き当たりました。

では、学校で教わる読み方のコツはどうなのか。調べると、コツの指導は5〜10時間で効果が頭打ちになっていました。一方、野球に詳しい子は、読解力の高い子より野球の文章をよく理解していました。

ここで「それは読解力が高いのではなく、知っていただけでは？」という疑問が出ました。答えは、そのとおり。そして、それこそが読解力の正体でした。

さらに、読める子はますます読み、差が開いていくこと（マタイ効果）、その差は遺伝だけで決まるのか、と疑問をたどり、「読解力は知識か、技術か」という1本にまとめました。
"""

