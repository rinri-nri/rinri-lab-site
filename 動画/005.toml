# ここにたどり着くまでの疑問の道すじ。上から順に、線でつないだ札になる。
# 最初の 疑問 が、この動画のきっかけ（トップのカードにも出る）
[["流れ"]]
"疑問" = "国語力って、どうやったら伸びるの？"
"分かったこと" = "読む力は、語彙・背景知識・文の構造を追う力に分けられる。なかでも背景知識がよく効く、という研究に行き当たった。"

[["流れ"]]
"疑問" = "じゃあ、学校で教わる読み方のコツは？"
"分かったこと" = "コツの指導は、5〜10時間で効果が頭打ちになっていた。一方で、野球に詳しい子は、読解力の高い子より野球の文章をよく理解していた。"

[["流れ"]]
"疑問" = "それは読解力が高いのではなく、知っていただけでは？"
"分かったこと" = "そのとおり。そして、それこそが読解力の正体だった。"

[["流れ"]]
"疑問" = "読める子と読めない子の差は、どうして開くの？"
"分かったこと" = "読める子はますます読み、知識が増え、さらに読めるようになる。差は年ごとに開いていく（マタイ効果）。"

[["流れ"]]
"疑問" = "その差は、生まれで決まってしまうの？"
"分かったこと" = "遺伝の影響は大きい。けれど差の多くは、後から積める知識の量だった。ここまでを「読解力は知識か、技術か」の1本にまとめた。"

