"番号" = 27
"題" = "絶海の孤島ヘンダーソン島の人々は、なぜ消えたのか"
"疑問の数" = 12
"勉強したこと" = ["持ち上がったサンゴの島", "石の成分で産地をたどる方法", "風上へ斜めに走るカヌー", "湖の泥に残った昔の雨の記録"]

[["流れ"]]
"疑問" = "人が住んでいた絶海の孤島から、なぜ人が消えたのか？"
"分かったこと" = "南太平洋のヘンダーソン島には、かつてポリネシアの人々が住んでいた。でも1606年にヨーロッパの船が来たとき、島には誰もいなかった。"

[["流れ"]]
"疑問" = "どれほど孤立した島なのか？"
"分かったこと" = "いちばん近いピトケアン島まで約200km、南アメリカ大陸まで約5,700km。島の一番高い所からも、ほかの島は水平線の下で見えない。硬い石も、カヌーを作れる大木も、川も無い。"

[["流れ"]]
"疑問" = "なぜ、命がけで海へ出たのか？"
"分かったこと" = "サモア・トンガの人々は1,700年以上、東へ出なかった。900年ごろ、この1500年で最大の乾燥が来て、いちばんひどい時期には雨が半分ほどに減った。干ばつ・人口・カヌーの進歩が重なって東へ出た、と著者たちは考えている。"

[["流れ"]]
"疑問" = "見えない島を、どうやって探したのか？"
"分かったこと" = "ふだんの風は東から西。風上の東へ探しに行けば、見つからなくても追い風で帰れる。カヌーは風に75度まで切り上がれた。島が見えるのは約30km 先までだが、鳥を追えば60〜190km 先から島に気づけた。"

[["流れ"]]
"疑問" = "石も木も無い島で、どうやって暮らしたのか？"
"分かったこと" = "石斧の玄武岩はピトケアン島から、焼き石と真珠貝はマンガレバ島から運ばれていた。石の成分で産地が分かった。ダイアモンドはこの結びつきを「へその緒」と呼ぶ。"

[["流れ"]]
"疑問" = "なぜ、船は来なくなったのか？"
"分かったこと" = "1450年ごろ、地層から輸入品が消え、1500年までに島どうしの行き来が止まった。ダイアモンドは、マンガレバの森が消えてカヌーが作れなくなったと考える。その後の研究も、森が消えたことを原因の1つとしている。"

[["流れ"]]
"疑問" = "取り残された人々は、どうなったのか？"
"分かったこと" = "ダイアモンドによれば、数十人が貝や鳥の骨で道具を作り、100年以上生き延びた。最後がどうだったかは、誰も書き残していない。"

[["流れ"]]
"疑問" = "結局、絶海の孤島の人々は、なぜ消えたのか？"
"分かったこと" = "干ばつに追われて海を渡り、隣の島々に支えられて暮らした。森が消えて船が来なくなり、出られない島に取り残された。島の食べ物を食べ尽くしたことが原因だ、という別の見方（アンダーソン）もある。"

