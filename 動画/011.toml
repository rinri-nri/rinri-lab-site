# 最初の 疑問 が、この動画のきっかけ（トップのカードにも出る）
[["流れ"]]
"疑問" = "世界一だったフィンランドは、どのくらい下がったの？"
"分かったこと" = "2006年の547点を頂点に、読解・数学・科学の3分野とも下がり続けていた。2025年の読解は474点だった。"

[["流れ"]]
"疑問" = "「子どもに自由を与えすぎた」のが原因なの？"
"分かったこと" = "手助けなしで子どもに発見させる授業は、成績を下げるという研究があった。ただ、子ども主導の方向は1994年の教育課程から始まっていて、最高点を取った2006年の15歳も、その課程で学んでいた。"

[["流れ"]]
"疑問" = "下がる前に、ほかに何が起きていたの？"
"分かったこと" = "読書離れが先に始まっていた。毎日楽しみで本を読む15歳は、2000年の約78%から2009年には約68%に減っていた。"

[["流れ"]]
"疑問" = "2018年から急に落ちたのは、なぜ？"
"分かったこと" = "世界全体も2012年ごろから下がっていた。10代のスマホの普及と、流し読みへの読み方の変化が最有力の説だった。"

[["流れ"]]
"疑問" = "2025年は、誰が落ちたの？"
"分かったこと" = "一番落ちたのは、裕福な家庭の子だった（OECD全体の読解で−20点）。理由は、OECDも「分からない」と言っている。原因は1つではなく、時期によって効いた原因が違った。ここまでを1本にまとめた。"

