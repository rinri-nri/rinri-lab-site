# ここにたどり着くまでの疑問の道すじ。上から順に、線でつないだ札になる。
# 最初の 疑問 が、この動画のきっかけ（トップのカードにも出る）
[["流れ"]]
"疑問" = "圧縮がうまいとは、予測がうまいということなの？"
"分かったこと" = "よく出る文字を短く書くだけでは足りなかった。ABと交互に続く1万文字は、ハフマン符号では1,250バイト、前の並びを写すZIPの方法なら34バイトになった。"

[["流れ"]]
"疑問" = "写真を、点を1つも捨てずに小さくできるのはなぜ？"
"分かったこと" = "PNGは、すでに書いた点から次の点の色を予測し、外れだけを書いている。投稿主の桜の写真は、元の28%になった。"

[["流れ"]]
"疑問" = "JPEGやMP3は、何をしているの？"
"分かったこと" = "人の目や耳が気づかない所を捨てている。写真は元の約1%、声は4.2%まで小さくなったが、捨てたものは戻らない。"

[["流れ"]]
"疑問" = "予測がうまいと、なぜ短く書けるの？"
"分かったこと" = "確率 p のものは、−log₂ p ビットで書ける（シャノン）。算術符号化を使えば、実際にほぼその長さで書ける。"

[["流れ"]]
"疑問" = "自分で予測器を作ったら、ZIPに勝てる？"
"分かったこと" = "直前の2文字から次の文字を予測すると、ZIPの41.7%に対して35.5%になった。ただし、練習で見たことのない話題は約3倍のビットがかかった。"

[["流れ"]]
"疑問" = "文章で練習したAIは、画像も縮められるの？"
"分かったこと" = "言語AIは、画像をPNG（58.5%）より小さい43.4%に縮めた。31個のAIでは、縮める力が強いほど試験の点が高かった。元に戻せる圧縮なら、圧縮と予測は数学的に同じだと分かった。ここまでを1本にまとめた。"

