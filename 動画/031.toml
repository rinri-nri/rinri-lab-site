[["流れ"]]
"疑問" = "宝くじを買う人は、計算ができないだけなのか？"
"分かったこと" = "アメリカの約3,000人の調査では、宝くじの払い戻しの予想は平均29%で、実際（60%）より悪く見ていた。フィンランドの約70万人の男性では、計算の点が高い人ほど馬券を買っていた。"

[["流れ"]]
"疑問" = "宝くじは、本当に半分戻るのか？"
"分かったこと" = "国の資料では、宝くじの払戻率は45.7%で、競馬などの公営競技（およそ75%）より低い。年末ジャンボを10枚買うと、約9割の人は300円しか戻らない。平均の「半分」は、何億円の当たりまで入れたときの数字。"

[["流れ"]]
"疑問" = "買う人は、損を知らないのか？"
"分かったこと" = "日本の調査では、宝くじのイメージに「夢を買えるチャンス」が87.5%、同じ調査で「どうせ当たらない」も34.6%。アメリカの調査では、計算の苦手さと結びつくのは使う額の43%で、「楽しそう」といった好みの質問のほうが、使う額をよく説明した。"

[["流れ"]]
"疑問" = "確率が分かれば、買わないのか？"
"分かったこと" = "カナダで学生に賭けの確率を教えると、計算はできるようになり、思い違いもしなくなった。それでも、賭ける人の割合・時間・額は、どの組でも変わらなかった。"

[["流れ"]]
"疑問" = "なぜ分かっていても、手が伸びるのか？"
"分かったこと" = "売れ方から逆算すると、買う人は、1等が実際の230倍当たりやすいかのようにふるまっていた。同じ人たちが、払い戻しは29%と悲観的に答える。小さな確率を重く感じる、1枚ずつだと安く見える、周りが買う、自分の立場への不満の4つが、手を伸ばさせる。"

[["流れ"]]
"疑問" = "夢には、いくらの価値があるのか？"
"分かったこと" = "オランダでくじの券をタダで配ると、抽せん前の幸せが10点満点で0.25〜0.40点上がった。くじのことを考えなかった人は上がらなかった。高額当せん者の生活の満足度は10年以上上がったままだが、日々の気分はほとんど変わらなかった。"

[["流れ"]]
"疑問" = "結局、宝くじを買う人は愚かなのか？"
"分かったこと" = "損を知らないのではない。頭では当たらないと分かっていて、決める瞬間だけ「当たるかも」と感じ、抽せんまでの夢を買っている。ほとんどの人には10分の1しか戻らないので、夢の値段としても高すぎる（最後の1点は作者の意見）。"

