[["流れ"]]
"疑問" = "早生まれの不利は、努力すれば追いつけるのか？"
"分かったこと" = "埼玉県の調査では、中学3年生の早生まれの子のほうが、学校の外で長く勉強し、塾にも通いやすい。それでも学力は偏差値で1.3〜1.8低いままだった。"

[["流れ"]]
"疑問" = "プロ野球選手は、何月生まれが多いのか？"
"分かったこと" = "日本のプロ野球選手2,238人のうち、4〜6月生まれは764人、1〜3月生まれは347人。アメリカで多いのは8〜10月生まれで、どちらも学年の区切りの直後。1〜3月生まれの割合は、小学生20%からプロ15.5%まで、上のレベルほど減る。"

[["流れ"]]
"疑問" = "早生まれでプロになった選手は、逆転するのか？"
"分かったこと" = "カナダのホッケーには逆転を示す研究がある。日本のプロ野球では逆転せず、19年を超えて続けた選手に1〜3月生まれは少ない。体重に上限のある競馬の騎手だけは、1〜3月生まれが35.5%で一番多い。効いているのは、選ぶ時点の体だった。"

[["流れ"]]
"疑問" = "教室の中では、何が起きているのか？"
"分かったこと" = "小学4年生で偏差値3.5あった差は、中学3年生で1.3〜1.8まで縮む。早生まれの子は学校の外の勉強が週に18分長い。それでも差は埋まりきらない。"

[["流れ"]]
"疑問" = "成績のほかに、何が残るのか？"
"分かったこと" = "計画どおりにやる力や誘惑に負けない力は偏差値で1ほど低く、学年が上がってもほとんど縮まない。先生や同級生との関係も少し悪く、スポーツや音楽にかける時間は週に12分ほど短い。"

[["流れ"]]
"疑問" = "その差は、大人になっても残るのか？"
"分かったこと" = "埼玉県のある市では、進んだ高校の偏差値が4.7違った。30代前半の男性の年収は、学年で一番遅く生まれた人のほうが4%低い。学年の区切りの直前の1週間に生まれた人は、直後の1週間に生まれた人より、自殺の割合が約27%高かった。"

[["流れ"]]
"疑問" = "親は、学年の区切りに気づいているのか？"
"分かったこと" = "誕生日ごとの生まれた数は、4月1日が少なく、4月2日が飛び抜けて多い。毎年1,800人を超える赤ちゃんの誕生日が、区切りの後へ移っていた。アメリカでは入学を1年遅らせる家庭があるが、日本で遅らせられるのは教育委員会が認めたときだけ。"

[["流れ"]]
"疑問" = "結局、「早生まれなだけで人生不利になる」は本当なのか？"
"分かったこと" = "日本では、差は大人になっても残り、努力では埋まりきらない。ノルウェーやドイツでは、収入の差はほとんど消えていた。なぜ日本で残るのかをはっきり答えた研究は、まだ無い。"

