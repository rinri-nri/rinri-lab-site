[["流れ"]]
"疑問" = "渋谷ハロウィンで、なぜ若者たちは暴徒化したのか？"
"分かったこと" = "2018年、集まった人々の一部が軽トラックを横転させた。個人の性格だけでなく、その場の人々の反応にも目を向けてみる。"

[["流れ"]]
"疑問" = "そもそも日本のハロウィンは、いつから広まったのか？"
"分かったこと" = "企業による商品販売やイベントが参加の機会を作り、やがて仮装した人々が渋谷に集まるようになった。"

[["流れ"]]
"疑問" = "ハロウィンが人を集めたのか、人が集まることでハロウィンになったのか？"
"分かったこと" = "始まりには既存の行事があった。その後は、集まる人の姿がさらに人を呼び、渋谷のハロウィンを大きくしていった。"

[["流れ"]]
"疑問" = "人が集まると、なぜ興奮が高まるのか？"
"分かったこと" = "火渡りの研究では、実行者と家族や友人の観客の間に心拍の変動の共有が見られた。デュルケームは人々が一緒に高揚する現象を集合的沸騰と呼んだ。"

[["流れ"]]
"疑問" = "その興奮は、なぜ逸脱へ向かうのか？"
"分かったこと" = "けんかを撮影した映像の研究には、観衆が争いの継続を求め、さらに加勢する場面があった。周囲の反応も、その場の行動を後押ししうる。"

[["流れ"]]
"疑問" = "逸脱した行動は、なぜ周りに広がるのか？"
"分かったこと" = "人によって参加する条件が違うと考える閾値モデルでは、最初の一人への反応が次の参加を呼ぶことがある。つながり方と複数の人からの働きかけも、参加に関係する。"

[["流れ"]]
"疑問" = "連鎖は止められないのか？"
"分かったこと" = "映像研究では、争いに割って入る人を見て、ほかの人も制止に加わる場面があった。反応の連鎖は、騒ぎを大きくする方向にも、止める方向にも働きうる。"

