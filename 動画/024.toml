[["流れ"]]
"疑問" = "「科学的根拠あり」の広告は、信じていいのか？"
"分かったこと" = "多くの場合、その根拠は「統計的に有意」という結果。けれど有意は「有意義」とも「95%本当」とも違う。"

[["流れ"]]
"疑問" = "p値は、何の確率なのか？"
"分かったこと" = "「差が無いなら、この結果はどれくらい珍しいか」を表す。「この結果なら、主張が正しい確率」ではない。"

[["流れ"]]
"疑問" = "同じ割合のずれでも、p値は同じなのか？"
"分かったこと" = "コインの表が5分の3でも、20回なら約2分の1、1000回なら10億分の1未満。数が増えると、小さな差でも有意になる。"

[["流れ"]]
"疑問" = "では、広告を見たら何を聞けばいいのか？"
"分かったこと" = "何点変わったのか、どれくらい確かか、お金と手間に見合うか、自分と同じ条件か。有意の一言では、どれも分からない。"

[["流れ"]]
"疑問" = "小さい差なら、気にしなくていいのか？"
"分かったこと" = "アスピリンの試験では、心筋梗塞が44%減った。10万人・1年あたりでは約185人。同じ結果でも、何を数えているかで意味が変わる。"

[["流れ"]]
"疑問" = "結局、科学的根拠は信じていいのか？"
"分かったこと" = "信じるな、ではない。「根拠あり」の言葉だけで満足せず、何と何を比べ、誰に、どれくらいの差があったのかを聞く。"

