# 動画020。新台本（2026-10-17 本人採用）・本編の低画質版・まとめ（新台本に合わせた09〜13と、旧の01・03・04・06）から作成。
"番号" = 20
"題" = "ネットミームは、なぜ流行り、なぜ廃れるのか"
"youtube" = "https://youtu.be/oBCMzOV9q_Y"
"公開日" = "2026-10-24"
"サムネ" = "020.png"
"勉強したこと" = ["SIRモデル", "拡散の構造（一斉と受け渡し）", "文化資本としてのミーム", "限られた注意の競争"]

[["流れ"]]
"疑問" = "すぐに消えるネタと、何年も残るネタは、何が違うのか？"
"分かったこと" = "猫ミームやえっほえっほのように、一気に見かけて、やがて見かけなくなるネタがある。一方で「だが断る」は、古くても使われ続けている。飽きたから、だけでは説明しきれない。"

[["流れ"]]
"疑問" = "ひとつのネタが、なぜ急にあちこちで見られるようになる？"
"分かったこと" = "見た人の一部が次の送り手になると、感染症のように広がる。1人が次に何人へ広げるかが1人を超えれば膨らむ。約10億件の拡散を調べた研究では、同じくらい大きな拡散でも、一斉に届くもの、何代も受け渡されるもの、両方が混ざるものがあった。"

[["流れ"]]
"疑問" = "見て笑うだけの動画と、自分も作りたくなる動画は何が違う？"
"分かったこと" = "多くの模倣を生んだ YouTube の動画30本のうち26本は、内容や考えが単純なものと分類された。登場人物が少ない、背景が簡素、繰り返す、という型があると、自分の話を入れてまねしやすい。"

[["流れ"]]
"疑問" = "「ぬるぽ」に「ガッ」と返せたとき、何が伝わったのか？"
"分かったこと" = "4chan の投稿を調べた研究では、ミームの使い方を外した人が新参者として非難されていた。ネタを知っていて、使いどころも分かっていることが、同じ文化を共有している人だという識別子になっていた。"

[["流れ"]]
"疑問" = "そのネタを、誰もが知るようになったら？"
"分かったこと" = "識別子は、知っている人が増えるほど識別子ではなくなる。大学生の言葉で「エース」は授業にほとんど出席しない人のことだったが、先生や広告が使い始めたら、意味は同じでも急に寒くなる。"

[["流れ"]]
"疑問" = "誰が使っているかで、好きなものは変わる？"
"分かったこと" = "多数派と同じだと知った人は、自分らしさを表す好みほど選び直しやすかった（Berger & Heath）。ここからは考えとして：ネタは飽きられて死ぬのではなく、持ち主が変わって死ぬ。2021年、マクドナルドがわざと下手に描き直したロゴをアイコンにした例もある。"

[["流れ"]]
"疑問" = "では「だが断る」は、なぜ死ななかったのか？"
"分かったこと" = "断る気持ちを少し大げさに言うための道具だから、誰が使っても役目が変わらない。噂のモデルでは、相手も知っていると伝えるのをやめるが、道具として使うネタは、相手も知っているからこそ笑いになる。"

[["流れ"]]
"疑問" = "流行の頂点とは、何だったのか？"
"分かったこと" = "限られた注意の取り合いだけでも、ネタの人気や寿命には大きなばらつきが出る（Weng ほか）。内輪の印として広がったネタは、広がりきった瞬間に印としての役目を終える。流行の頂点は、終わりの始まりでもあった。"

