"勉強したこと" = ["純資産（借金を引いた資産）", "資産の分布の分位", "親子の資産の順位の相関", "所得の弾力性", "富裕税"]

[["流れ"]]
"疑問" = "イーロン・マスク1人の資産は、貧しい人何人分なのか？"
"分かったこと" = "資産は約9,085億ドル（約144兆円）で、日本の国の1年分の予算より多い。世界でいちばん貧しい人から足していくと約38億人。ただし、その大半は借金の穴を埋める分で、借金を除いて数え直すと約15.5億人。上位10人なら約25億人になる。"

[["流れ"]]
"疑問" = "日本人は、世界の富のどこにいるのか？"
"分かったこと" = "真ん中の日本人の資産は約1,113万円で、マスク1人はその約1,290万人分（東京都の人口の約9割）。そしてその日本人は、世界の大人の上位約16%にいる。"

[["流れ"]]
"疑問" = "運だけで、富は一部の人に集まるのか？"
"分かったこと" = "1万人が毎年コインを投げ、資産が5割増えるか5割減るだけの世界を100年続けた。全員が同じ条件でも、上位1%が富の約99%を持った。1.5倍と0.5倍を1回ずつ引くと0.75倍になる、掛け算の性質による。"

[["流れ"]]
"疑問" = "世界の格差は、広がっているのか？"
"分かったこと" = "20世紀に一度大きく縮み、上位1%・10%の取り分は1990年代から横ばい。下半分の資産も3倍に増えた。ただし、上位0.01%の取り分だけは約2倍（6.5%→11.6%）になっていた。"

[["流れ"]]
"疑問" = "一番上の富は、入れ替わるのか？"
"分かったこと" = "多くの家では、親子の資産の順位の相関は0.3〜0.4で、代を重ねると真ん中へ近づく。養子の研究では、生みの親より育ての親の資産が効く。ところが一番上は別で、スウェーデンの上位0.1%は親子の所得の弾力性が約0.9。フィレンツェでは、1427年に上だった名字の子孫が今も豊か。"

[["流れ"]]
"疑問" = "富は、分け直せるのか？"
"分かったこと" = "資産10億ドル超の人に2%の最低課税をかけると、年約2,500億ドル。コインの世界に2%の税をかけると、上位1%の取り分は約53%で止まった。富裕税は OECD で12か国から4か国に減ったが、ノルウェーの増税で国を出たのは多くても約100人だった。"

[["流れ"]]
"疑問" = "なぜ世界の富は、ここまで偏るのか？"
"分かったこと" = "富は掛け算で増え、運で偏り、いちばん上では、生まれのまま受け継がれるからである。"

