"題" = "「存在意義はない」と言われたトクホの欺瞞"
"youtube" = "https://youtu.be/ed5ie5bE6lI"
"公開日" = "2026-11-07"
"サムネ" = "026.png"
"疑問の数" = 15
"勉強したこと" = ["トクホの許可表示", "偽物と比べる二重盲検の試験", "おなかの脂肪の断面積", "資金の出どころと結論の偏り"]

[["流れ"]]
"疑問" = "国が認めたお茶なのに、なぜ「存在意義はない」と言われたのか？"
"分かったこと" = "2015年、消費生活アナリストの板倉ゆか子さんが国の会議で、効果は小さいのに包装と広告が大きく見せていると指摘した。指摘は大きく分けて4つ。"

[["流れ"]]
"疑問" = "効果はどれくらいなのか？"
"分かったこと" = "国の審査が求めるのは、偽物との「有意な差」。差の大きさの下限は見当たらない。特茶の差は12週でおなかの脂肪の断面積 -10.30cm²（約3%）で、その半分ほどは偽物の群が増えた分。"

[["流れ"]]
"疑問" = "試験をしたのは誰なのか？"
"分かったこと" = "特茶の論文の著者は、大半がサントリーの社員。不正の証拠は無い。ただ、業界のお金だけで行った飲み物の試験では、会社に不利な結論が1本も無かった（業界のお金なしでは37%）。"

[["流れ"]]
"疑問" = "なぜ「減らす」ではなく「助ける」なのか？"
"分かったこと" = "食品は体への効き目を言えなかった。そこに1991年、国が審査した表示だけ言ってよいという例外の窓を開けた。それでも利用者の43.2%は、許可された表示を知らなかった。"

[["流れ"]]
"疑問" = "広告は何と言っていたのか？"
"分かったこと" = "「“体脂肪を減らす”のを助ける初のトクホ」「食事の脂肪をスルー」。許可表示の一部を、強い言葉に言い換えていた。体脂肪のトクホの広告が処分された例は見つかっていない。"

[["流れ"]]
"疑問" = "指摘のあと、何が変わったか？"
"分かったこと" = "「体脂肪を減らす」と縮める表示は、国の質疑応答集に「誤認を与えるおそれ」の例として載った。でも禁止ではなく、委員会は2017年に「依然として対応が不十分」と意見した。"

[["流れ"]]
"疑問" = "結局、トクホの体脂肪の効果はあてにならないのか？"
"分かったこと" = "ウソは見つかっていない。でも、小さくても合格する審査、売る会社がやる試験、強く言い換えた広告が重なって、体脂肪を落としたくて飲む人にとっては、全然あてにならない。"

